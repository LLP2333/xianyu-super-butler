# 构建并发布 Docker 镜像到 GitHub Container Registry (ghcr.io)
#
# 为什么需要这个：NAS、软路由这类设备上本地 `docker compose build` 要跑
# npm ci + vite build + pip 编译 + 下载 Chromium，CPU 会长时间打满，
# 内存不够时直接 OOM，表现为"部署不上、机器卡死"。
# 有了预构建镜像，这些设备只需要 pull，几分钟就能起来。
#
# 自用分支发布：ghcr.io/llp2333/xianyu-super-butler:personal
# 每次同时发布 sha-<完整提交号>，部署时可固定版本。
# 首次发布后需要到仓库 Packages 页面把镜像设为 Public，否则 pull 需要登录。

name: Publish personal Docker image

on:
  push:
    branches:
      - personal
  workflow_dispatch:

concurrency:
  group: publish-personal-image
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: llp2333/xianyu-super-butler

jobs:
  build-and-push:
    if: github.repository == 'LLP2333/xianyu-super-butler' && github.ref == 'refs/heads/personal'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 交叉编译 arm64 需要，飞牛等 NAS 有一部分是 ARM 机型
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=personal
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
