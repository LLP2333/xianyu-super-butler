# 闲鱼智控 —— NAS / 低配设备专用部署配置（零构建）
#
# 适用于飞牛 fnOS、群晖、威联通、软路由等设备。
#
# 与 docker-compose.yml 的区别，也是这个文件存在的原因：
#   1. 不在本机构建镜像，直接拉预构建镜像。NAS 上跑 npm ci + vite build +
#      pip 编译 + 下载 Chromium 会让 CPU 长时间 100%，内存不够时 OOM，
#      表现就是"部署不上、机器卡死"。
#   2. 不依赖 .env 文件。NAS 的 Docker 图形界面里通常只能贴 compose 内容，
#      没有地方放 .env，原配置的 ${ADMIN_PASSWORD:?...} 会直接让部署中断。
#   3. 内存上限给到 3G。Chromium 冷启动峰值就要 300~500M，2G 容易被 OOM
#      杀掉，配合 restart 策略会变成反复重启、CPU 一直满。
#
# 使用前请注意：默认账号是 admin / admin123，登录后立刻改密码。
#
# 使用 personal 分支在你自己的 GitHub 仓库构建的镜像。
# 首次使用前推送 personal，等待 Publish personal Docker image 成功。
# 默认跟随 personal；固定版本时将下方标签改成 sha-<完整提交号>。
# 更新并启动：
#   docker pull lscr.io/linuxserver/chrome:latest
#   docker compose -f docker-compose.nas.yml pull
#   docker compose -f docker-compose.nas.yml up -d

services:
  xianyu-app:
    image: ghcr.io/llp2333/xianyu-super-butler:personal
    container_name: xianyu-super-butler
    stop_grace_period: 60s
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # Grants the application full Docker management authority.
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data:rw
      - ./logs:/app/logs:rw
      - ./backups:/app/backups:rw
    environment:
      ACCOUNT_BROWSER_IMAGE: lscr.io/linuxserver/chrome:latest
      ACCOUNT_BROWSER_NETWORK: xianyu-browsers
      ACCOUNT_BROWSER_CDP_CONFIG: "${ACCOUNT_BROWSER_CDP_CONFIG:-${PWD}/deploy/account-browser/cdp.conf}"
      ACCOUNT_BROWSER_BIND: "${ACCOUNT_BROWSER_BIND:-127.0.0.1}"
      ACCOUNT_BROWSER_API_URL: "http://xianyu-app:8080"
      ACCOUNT_BROWSER_HOST: "${ACCOUNT_BROWSER_HOST:-localhost}"
      TZ: Asia/Shanghai
      DB_PATH: /app/data/xianyu_data.db
      LOG_LEVEL: INFO

      # 默认账号 admin / admin123，登录后请在「设置 → 账号与同步 → 修改登录密码」改掉。
      # 只在首次创建数据库时生效；数据库已存在时改这里不会改密码。
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin123

      AUTO_REPLY_ENABLED: "true"
      AUTO_DELIVERY_ENABLED: "true"
      AI_REPLY_ENABLED: "false"
    networks:
      - browser-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 3072M
        reservations:
          memory: 512M

networks:
  browser-network:
    name: xianyu-browsers
    driver: bridge
